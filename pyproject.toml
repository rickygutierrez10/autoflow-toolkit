
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoflow-toolkit"
version = "0.1.0"
description = "A simple open-source Python file automation toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
autoflow = "autoflow.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.11.0",
]

[tool.setuptools.packages.find]
include = ["autoflow*"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
