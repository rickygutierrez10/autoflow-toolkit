
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoflow-toolkit"
version = "0.1.0"
description = "A simple open-source Python file automation toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[tool.setuptools.packages.find]
include = ["autoflow*"]
[project.scripts]
autoflow = "autoflow.cli:main"