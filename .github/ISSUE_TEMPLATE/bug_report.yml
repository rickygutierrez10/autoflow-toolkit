
name: Bug Report
description: Report a problem or unexpected behaviour in AutoFlow.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve AutoFlow. Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What went wrong?
      placeholder: Describe the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Explain how someone can reproduce the problem.
      placeholder: |
        1. Run the command...
        2. Provide the folder...
        3. Describe what happened...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead?
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your operating system, Python version and AutoFlow version.
      placeholder: |
        Operating system:
        Python version:
        AutoFlow version:
    validations:
      required: false

  - type: textarea
    id: errors
    attributes:
      label: Error messages
      description: Paste any relevant error messages.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add anything else that might help us understand the problem.
    validations:
      required: false
