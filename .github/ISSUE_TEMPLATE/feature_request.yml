
name: Feature Request
description: Suggest an improvement or new feature for AutoFlow.
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement to AutoFlow.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: Describe the problem or limitation you are experiencing.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution
      description: Explain what you would like AutoFlow to do.
    validations:
      required: true

  - type: textarea
    id: behaviour
    attributes:
      label: Proposed behaviour
      description: Describe how you imagine this feature working.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered alternative solutions or workarounds?
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add examples or other information that might help explain your suggestion.
    validations:
      required: false
