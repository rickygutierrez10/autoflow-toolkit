
name: AutoFlow Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install AutoFlow and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          coverage run --branch --source=autoflow -m unittest discover -s tests -v
          coverage report --fail-under=90

  lint:
    name: Check Code Quality
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install AutoFlow and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check autoflow tests

  package:
    name: Test Package Installation
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build Python package
        run: python -m build

      - name: Create clean environment
        run: python -m venv /tmp/autoflow-test-env

      - name: Install built package
        run: |
          /tmp/autoflow-test-env/bin/python -m pip install dist/*.whl

      - name: Test installed command
        run: |
          /tmp/autoflow-test-env/bin/autoflow --help

      - name: Test package import
        run: |
          /tmp/autoflow-test-env/bin/python -c "from autoflow.duplicates import scan_duplicates; print('AutoFlow package import successful')"
